<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Kitchen Renovation Schedule</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: light dark;
      --bg: #f6f4f0;
      --surface: #ffffff;
      --surface-2: #f2efea;
      --border: #e4dfd7;
      --line: #efebe5;
      --text: #1f1b16;
      --text-2: #4f483f;
      --text-3: #6f675c;
      --accent: #2f5d50;
      --accent-soft: #e2eee9;
      --danger: #b42318;
      --danger-soft: #fdecea;
      --warn: #8a5a00;
      --warn-soft: #fff4dc;
      --weekend: rgba(60, 50, 40, 0.045);
      --gridline: rgba(60, 50, 40, 0.11);
      --holiday: rgba(180, 35, 24, 0.07);
      --shadow: 0 1px 2px rgba(31, 27, 22, 0.05), 0 8px 24px rgba(31, 27, 22, 0.05);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121110;
        --surface: #1b1917;
        --surface-2: #24211e;
        --border: #34302b;
        --line: #282521;
        --text: #f3efe9;
        --text-2: #d0c8bd;
        --text-3: #a59c90;
        --accent: #86c5ae;
        --accent-soft: #1d2e28;
        --danger: #ff8b7b;
        --danger-soft: #3a1d19;
        --warn: #f2c14e;
        --warn-soft: #342b14;
        --weekend: rgba(255, 255, 255, 0.03);
        --gridline: rgba(255, 255, 255, 0.08);
        --holiday: rgba(255, 139, 123, 0.08);
        --shadow: none;
      }
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    button { font: inherit; color: inherit; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }

    .page { max-width: 1280px; margin: 0 auto; padding: 36px 24px 56px; }
    @media (max-width: 640px) { .page { padding: 24px 16px 40px; } }

    /* ---------- Header ---------- */
    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 4px 0 6px;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(30px, 4.5vw, 44px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .meta { margin: 0 0 24px; color: var(--text-3); font-size: 14px; }

    .banner { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
    .banner ul { margin: 6px 0 0; padding-left: 20px; }
    .banner-error { background: var(--danger-soft); color: var(--danger); }
    .banner-warn { background: var(--warn-soft); color: var(--warn); }

    /* ---------- Stats ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .stat-label { color: var(--text-3); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat-sub { color: var(--text-3); font-size: 13px; }
    .stat-sub.bad { color: var(--danger); font-weight: 600; }
    .stat-sub.good { color: var(--accent); }
    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat { padding: 12px; }
      .stat-value { font-size: 17px; }
    }
    .progress { height: 6px; border-radius: 999px; background: var(--surface-2); margin: 8px 0 4px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card-head { display: flex; align-items: baseline; gap: 10px; padding: 16px 18px 6px; flex-wrap: wrap; }
    .card-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
    .card-sub { color: var(--text-3); font-size: 13px; }

    /* ---------- Task list items (Coming up + List view) ---------- */
    .items { list-style: none; margin: 0; padding: 4px 8px 10px; }
    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      column-gap: 12px;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .item:hover, .item:focus-visible { background: var(--surface-2); outline: none; }
    .datebox {
      flex: none;
      width: 46px;
      text-align: center;
      border-radius: 8px;
      background: var(--surface-2);
      padding: 4px 0 3px;
      line-height: 1.1;
    }
    .datebox b { display: block; color: var(--text-3); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .datebox span { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .item-main { flex: 1; min-width: 0; }
    .item-name { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-sub { display: block; color: var(--text-3); font-size: 13px; }
    .item-sub .dot { margin-right: 6px; vertical-align: 0; }
    .empty { color: var(--text-3); padding: 8px 18px 18px; margin: 0; }
    @media (max-width: 640px) {
      .item { grid-template-columns: auto 1fr; padding: 9px 8px; }
      .item .datebox { grid-row: span 2; align-self: start; }
      .item-name { white-space: normal; }
      .item .badge { grid-column: 2; justify-self: start; margin-top: 4px; }
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
    .badge {
      flex: none;
      font-size: 11px;
      font-weight: 650;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-2);
      white-space: nowrap;
    }
    .badge.done { background: var(--accent-soft); color: var(--accent); }
    .badge.active, .badge.now { background: var(--accent); color: var(--surface); }
    .badge.overdue, .badge.delayed { background: var(--danger-soft); color: var(--danger); }
    .badge.crit { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--text); }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      flex-wrap: wrap;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    @media (max-width: 640px) {
      .toolbar { padding: 12px 16px; }
      .chips { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .chip { flex: none; }
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--text-3); }
    .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
    .chip .n { opacity: 0.6; font-variant-numeric: tabular-nums; }
    .toolbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
    .toggle input { accent-color: var(--text); width: 15px; height: 15px; margin: 0; }
    .segmented { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); }
    .segmented button {
      border: 0;
      background: none;
      padding: 4px 12px;
      border-radius: 7px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
    }
    .segmented button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .share {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 18px 12px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      font-size: 13px;
      color: var(--text-2);
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--text-3); }
    .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; }

    /* ---------- Gantt ---------- */
    .gantt { overflow: auto; max-height: min(78vh, 980px); border-top: 1px solid var(--border); position: relative; }
    .g-inner { position: relative; }
    .g-head { position: sticky; top: 0; z-index: 4; display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .g-corner {
      position: sticky; left: 0; z-index: 5;
      flex: none;
      display: flex; align-items: flex-end;
      padding: 0 12px 6px 18px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      color: var(--text-3); font-size: 12px; font-weight: 600;
    }
    .g-scale { position: relative; flex: none; height: 46px; }
    .g-month, .g-week { position: absolute; overflow: hidden; white-space: nowrap; }
    .g-month { top: 0; height: 24px; padding: 5px 6px 0; font-size: 12px; font-weight: 650; color: var(--text-2); border-left: 1px solid var(--border); }
    .g-week { top: 24px; height: 22px; padding: 2px 4px 0; font-size: 11px; color: var(--text-3); border-left: 1px solid var(--gridline); font-variant-numeric: tabular-nums; }
    .g-today-pill {
      position: absolute; top: 25px; z-index: 1;
      transform: translateX(-50%);
      padding: 1px 7px; border-radius: 999px;
      background: var(--text); color: var(--surface);
      font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    }
    .g-body { position: relative; }
    .g-grid { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
    .g-hol { position: absolute; top: 0; bottom: 0; background: var(--holiday); }
    .g-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); opacity: 0.55; }
    .g-row { position: relative; z-index: 1; display: flex; height: 32px; border-bottom: 1px solid var(--line); }
    .g-row.phase { height: 30px; background: color-mix(in srgb, var(--surface-2) 75%, transparent); }
    .g-label {
      position: sticky; left: 0; z-index: 2;
      flex: none;
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px 0 18px;
      background: var(--surface);
      border: 0; border-right: 1px solid var(--border);
      font-size: 13px; text-align: left;
      cursor: pointer;
    }
    button.g-label:hover, button.g-label:focus-visible { background: var(--surface-2); outline: none; }
    .g-row.phase .g-label {
      cursor: default;
      background: var(--surface-2);
      color: var(--text-3);
      font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      white-space: nowrap;
      overflow: visible;
    }
    .g-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .g-dates { color: var(--text-3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .narrow .g-dates { display: none; }
    .g-track { position: relative; flex: none; }
    .g-bar {
      position: absolute; top: 8px; height: 16px;
      border-radius: 4px;
      background-color: var(--c);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .g-bar:hover { filter: brightness(1.08); }
    .g-bar.wait {
      background-color: transparent;
      background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 45%, transparent) 0 2px, transparent 2px 6px);
      box-shadow: inset 0 0 0 1.5px var(--c);
    }
    .g-bar.ms { width: 13px; height: 13px; top: 9.5px; border-radius: 2px; transform: rotate(45deg); }
    .g-bar.st-active:not(.wait) { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.32) 0 4px, transparent 4px 8px); }
    .g-bar.st-done { opacity: 0.4; }
    .g-bar.st-overdue, .g-bar.st-delayed { outline: 2px solid var(--danger); outline-offset: 1px; }
    .g-mark { position: absolute; top: 7px; font-size: 12px; line-height: 18px; font-weight: 700; pointer-events: none; }
    .g-mark.done { color: var(--accent); }
    .g-mark.bad { color: var(--danger); }
    .crit-on .g-bar:not(.crit) { opacity: 0.16; }
    .crit-on .g-row:not(.is-crit):not(.phase) .g-name { color: var(--text-3); }
    .crit-on .g-bar.crit { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--text); }
    .crit-on .g-bar.wait.crit { box-shadow: inset 0 0 0 1.5px var(--c), 0 0 0 2px var(--surface), 0 0 0 3.5px var(--text); }

    /* ---------- List view ---------- */
    .list { border-top: 1px solid var(--border); padding-bottom: 6px; }
    .list h3 {
      margin: 0; padding: 14px 18px 4px;
      color: var(--text-3); font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    }
    .crit-on .item:not(.is-crit) { opacity: 0.4; }

    .legend {
      display: flex; flex-wrap: wrap; gap: 8px 18px;
      padding: 12px 18px 14px;
      border-top: 1px solid var(--border);
      color: var(--text-3); font-size: 12px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .lg { display: inline-block; flex: none; --c: var(--text-3); }
    .lg-work { width: 22px; height: 10px; border-radius: 3px; background: var(--c); }
    .lg-wait { width: 22px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--c); background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 45%, transparent) 0 2px, transparent 2px 6px); }
    .lg-ms { width: 9px; height: 9px; margin: 0 2px; transform: rotate(45deg); background: var(--c); border-radius: 1px; }
    .lg-today { width: 2px; height: 14px; background: var(--text); opacity: 0.55; }
    .lg-hol { width: 14px; height: 14px; background: var(--holiday); border-radius: 2px; box-shadow: inset 0 0 0 1px var(--gridline); }

    /* ---------- Team ---------- */
    .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding: 8px 18px 18px; }
    .member {
      display: block; width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface);
      text-align: left; cursor: pointer;
    }
    .member:hover, .member:focus-visible { border-color: var(--text-3); outline: none; }
    .member-top { display: flex; align-items: center; gap: 8px; font-weight: 650; }
    .member-who { color: var(--text-2); font-size: 13px; margin-top: 2px; }
    .member-when { color: var(--text-3); font-size: 13px; margin-top: 6px; }
    .member-next { font-size: 13px; margin-top: 2px; }

    .footer { color: var(--text-3); font-size: 13px; margin-top: 24px; text-align: center; }

    /* ---------- Detail dialog ---------- */
    dialog {
      width: min(520px, calc(100vw - 32px));
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25);
    }
    dialog::backdrop { background: rgba(20, 16, 12, 0.45); }
    .d-inner { padding: 18px 20px 20px; }
    .d-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .d-trade { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); font-weight: 600; }
    .d-close { border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
    .d-inner h3 { margin: 10px 0 12px; font-size: 20px; line-height: 1.25; }
    .d-inner dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
    .d-inner dt { color: var(--text-3); }
    .d-inner dd { margin: 0; }
    .d-note { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; color: var(--text-2); }
    .d-crit { margin: 14px 0 0; font-size: 13px; font-weight: 600; }
    .d-warn { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
    .d-links { display: flex; flex-wrap: wrap; gap: 4px 12px; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px;
      background: var(--text); color: var(--surface);
      font-size: 13px; font-weight: 600; z-index: 10;
    }

    @media print {
      body { background: #fff; }
      .toolbar, .share, .upcoming, .footer a { display: none !important; }
      .gantt { max-height: none; overflow: visible; }
      .card, .stat { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow">Shared project schedule</p>
      <h1 id="title">Kitchen Renovation</h1>
      <p class="meta" id="meta"></p>
    </header>

    <div id="errors" class="banner banner-error" role="alert" hidden></div>
    <div id="warnings" class="banner banner-warn" hidden></div>

    <main id="app" hidden>
      <section class="stats" id="stats" aria-label="Project summary"></section>

      <section class="card upcoming" aria-labelledby="upcomingTitle">
        <div class="card-head">
          <h2 id="upcomingTitle">Coming up</h2>
          <span class="card-sub" id="upcomingSub"></span>
        </div>
        <ul class="items" id="upcoming"></ul>
      </section>

      <section class="card" id="schedule" aria-labelledby="scheduleTitle">
        <div class="card-head">
          <h2 id="scheduleTitle">Schedule</h2>
          <span class="card-sub">Click any task for details</span>
        </div>
        <div class="toolbar">
          <div class="chips" id="chips" role="group" aria-label="Filter by trade"></div>
          <div class="toolbar-right">
            <label class="toggle" title="Tasks where any delay pushes back the finish date">
              <input type="checkbox" id="critToggle"> Critical path
            </label>
            <div class="segmented" role="tablist" aria-label="View">
              <button type="button" role="tab" data-view="timeline">Timeline</button>
              <button type="button" role="tab" data-view="list">List</button>
            </div>
          </div>
        </div>
        <div class="share" id="share" hidden></div>
        <div class="gantt" id="timeline"></div>
        <div class="list" id="list" hidden></div>
        <div class="legend">
          <span><i class="lg lg-work"></i>Work on site</span>
          <span><i class="lg lg-wait"></i>Waiting: orders, permits, fabrication</span>
          <span><i class="lg lg-ms"></i>Milestone</span>
          <span><i class="lg lg-today"></i>Today</span>
          <span><i class="lg lg-hol"></i>Holiday / no work</span>
        </div>
      </section>

      <section class="card" aria-labelledby="teamTitle">
        <div class="card-head">
          <h2 id="teamTitle">Team</h2>
          <span class="card-sub">Who is needed, and when</span>
        </div>
        <div class="team" id="team"></div>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>

  <dialog id="detail" aria-labelledby="dTitle"><div class="d-inner" id="detailBody"></div></dialog>

  <script src="schedule.js"></script>
  <script>
  (function () {
    'use strict';

    // ============================================
    // DATES: whole days since 1970-01-01 (UTC), so no time-zone drift
    // ============================================
    const DAY_MS = 86400000;
    const $ = (sel) => document.querySelector(sel);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function parseDate(s) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
      if (!m) throw new Error(`"${s}" is not a valid date. Use the format YYYY-MM-DD.`);
      return Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY_MS;
    }
    const weekday = (n) => ((n + 4) % 7 + 7) % 7; // 0 = Sunday
    const fmt = (n, o) => new Date(n * DAY_MS).toLocaleDateString('en-US', Object.assign({ timeZone: 'UTC' }, o));
    const fmtShort = (n) => fmt(n, { month: 'short', day: 'numeric' });
    const fmtDay = (n) => fmt(n, { weekday: 'short', month: 'short', day: 'numeric' });
    const plural = (k, word) => `${k} ${word}${k === 1 ? '' : 's'}`;

    function makeCalendar(holidays) {
      const off = new Set(holidays.map(parseDate));
      const isWork = (n) => { const w = weekday(n); return w !== 0 && w !== 6 && !off.has(n); };
      const onOrAfter = (n) => { while (!isWork(n)) n++; return n; };
      const after = (n) => onOrAfter(n + 1);
      const forward = (n, k) => { n = onOrAfter(n); while (k-- > 0) n = after(n); return n; };
      const back = (n, k) => { while (k-- > 0) { n--; while (!isWork(n)) n--; } return n; };
      const count = (a, b) => { let k = 0; for (let n = a; n <= b; n++) if (isWork(n)) k++; return k; };
      return { off, isWork, onOrAfter, after, forward, back, count };
    }

    // ============================================
    // SCHEDULER: forward pass over `after` / `before` links
    // ============================================
    function schedule(tasks, projectStart, cal, bumpId) {
      const byId = new Map(tasks.map((t) => [t.id, t]));
      const out = new Map();
      const visiting = new Set();

      function calc(id, from) {
        if (out.has(id)) return out.get(id);
        const t = byId.get(id);
        if (!t) throw new Error(`Task "${from}" refers to "${id}", which doesn't exist. Check the spelling.`);
        if (visiting.has(id)) throw new Error(`Tasks wait on each other in a loop, around "${id}".`);
        visiting.add(id);

        const milestone = !t.days && !t.weeks;
        const deps = (t.after || []).map((d) => calc(d, id));
        let earliest = projectStart;
        let depEnd = null;
        if (deps.length) {
          depEnd = Math.max(...deps.map((d) => d.end));
          earliest = milestone ? depEnd : cal.after(depEnd);
        }
        if (t.lag) earliest = cal.forward(earliest, t.lag);

        let start = earliest;
        if (t.before) start = Math.max(start, cal.back(calc(t.before, id).start, t.lead || 0));

        let conflict = null;
        if (t.start) {
          const pinned = parseDate(t.start);
          if (depEnd !== null && pinned < earliest) {
            conflict = `It's pinned to ${fmtDay(pinned)}, but the work it waits on isn't scheduled to finish until ${fmtDay(depEnd)}.`;
          }
          start = pinned;
        }
        start = cal.onOrAfter(start);

        let end = t.weeks ? start + t.weeks * 7 - 1 : milestone ? start : cal.forward(start, t.days - 1);
        if (id === bumpId) { end = cal.after(end); if (milestone) start = end; }

        const r = { id, task: t, start, end, milestone, wait: !!t.weeks, conflict };
        visiting.delete(id);
        out.set(id, r);
        return r;
      }

      tasks.forEach((t) => calc(t.id));
      return out;
    }

    const lastEnd = (sched) => Math.max(...[...sched.values()].map((r) => r.end));

    // A task is critical if a one-day slip in it moves the finish date.
    function findCritical(tasks, projectStart, cal, finish) {
      const crit = new Set();
      for (const t of tasks) {
        if (t.status === 'done') continue;
        if (lastEnd(schedule(tasks, projectStart, cal, t.id)) > finish) crit.add(t.id);
      }
      return crit;
    }

    // ============================================
    // MODEL
    // ============================================
    const params = new URLSearchParams(location.search);
    let M; // built model
    const state = { trade: null, view: 'timeline', critical: false };

    function todayNum() {
      if (params.get('today')) return parseDate(params.get('today'));
      const d = new Date();
      return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS;
    }

    function build() {
      const data = window.RENOVATION;
      if (!data || !data.project || !Array.isArray(data.phases)) {
        throw new Error('The schedule file (schedule.js) did not load. If it was just edited, look for a missing comma, quote or bracket near the last change.');
      }
      const cal = makeCalendar(data.project.holidays || []);
      const warnings = [];
      const trades = Object.assign({}, data.trades);
      const tasks = [];
      const phaseOf = new Map();

      data.phases.forEach((p, i) => (p.tasks || []).forEach((t) => {
        if (!t.id) throw new Error(`A task in "${p.name}" is missing an id.`);
        if (phaseOf.has(t.id)) throw new Error(`Two tasks share the id "${t.id}". Each id must be unique.`);
        if (!trades[t.trade]) {
          warnings.push(`"${t.name}" uses trade "${t.trade}", which isn't in the trades list.`);
          trades[t.trade] = { name: t.trade || 'Unassigned', who: '', color: '#8a8277' };
        }
        tasks.push(t);
        phaseOf.set(t.id, i);
      }));

      const projectStart = cal.onOrAfter(parseDate(data.project.start));
      const sched = schedule(tasks, projectStart, cal);
      const finish = lastEnd(sched);
      const crit = findCritical(tasks, projectStart, cal, finish);

      const succ = new Map(tasks.map((t) => [t.id, []]));
      tasks.forEach((t) => (t.after || []).forEach((d) => succ.get(d).push(t.id)));

      const items = tasks.map((t) => Object.assign(sched.get(t.id), { phase: phaseOf.get(t.id) }));
      items.forEach((r) => { if (r.conflict) warnings.push(`"${r.task.name}": ${r.conflict}`); });

      const order = (a, b) => a.phase - b.phase || a.start - b.start || a.end - b.end;
      items.sort(order);

      return {
        data, cal, trades, items, byId: sched, succ, crit, finish, warnings,
        start: Math.min(...items.map((r) => r.start)),
        today: todayNum(),
      };
    }

    function statusOf(r) {
      const s = r.task.status;
      if (s === 'done') return { key: 'done', label: 'Done' };
      if (s === 'delayed') return { key: 'delayed', label: 'Delayed' };
      if (r.end < M.today) return { key: 'overdue', label: 'Past due' };
      if (s === 'in-progress') return { key: 'active', label: 'In progress' };
      if (r.start <= M.today) return { key: 'now', label: 'Scheduled now' };
      return { key: 'planned', label: 'Planned' };
    }

    const tradeOf = (r) => M.trades[r.task.trade];

    function rangeShort(r) {
      if (r.start === r.end) return fmtShort(r.start);
      const sameMonth = fmt(r.start, { month: 'short' }) === fmt(r.end, { month: 'short' });
      return sameMonth ? `${fmtShort(r.start)} – ${fmt(r.end, { day: 'numeric' })}` : `${fmtShort(r.start)} – ${fmtShort(r.end)}`;
    }
    function rangeLong(r) {
      return r.start === r.end ? fmtDay(r.start) : `${fmtDay(r.start)} – ${fmtDay(r.end)}`;
    }
    function durationText(r) {
      if (r.milestone) return 'Milestone';
      if (r.task.weeks) return `${plural(r.task.weeks, 'week')} (calendar time)`;
      return plural(r.task.days, 'working day');
    }

    const visibleItems = () => M.items.filter((r) => !state.trade || r.task.trade === state.trade);

    // ============================================
    // RENDER
    // ============================================
    function renderHeader() {
      const p = M.data.project;
      document.title = `${p.name} · Schedule`;
      $('#title').textContent = p.name;
      $('#meta').textContent = p.updated ? `Last updated ${fmt(parseDate(p.updated), { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}` : '';
      const w = $('#warnings');
      if (M.warnings.length) {
        w.innerHTML = `<strong>${plural(M.warnings.length, 'scheduling issue')} to check</strong><ul>${M.warnings.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
        w.hidden = false;
      }
    }

    function renderStats() {
      const items = M.items;
      const real = items.filter((r) => !r.milestone);
      const done = real.filter((r) => r.task.status === 'done').length;
      const pct = real.length ? Math.round((done / real.length) * 100) : 0;
      const behind = items.filter((r) => ['overdue', 'delayed'].includes(statusOf(r).key)).length;
      const total = M.cal.count(M.start, M.finish);
      const allDone = done === real.length;

      let nowValue, nowSub;
      if (allDone) { nowValue = 'Complete'; nowSub = 'All tasks are done'; }
      else if (M.today < M.start) {
        const d = M.start - M.today;
        nowValue = 'Not started'; nowSub = `Work begins in ${plural(d, 'day')}`;
      } else if (M.today > M.finish) {
        nowValue = 'Past target date';
        nowSub = `${plural(real.length - done, 'task')} still open`;
      } else {
        // Prefer on-site work happening today, then waiting periods, then whatever is next.
        const open = items.filter((r) => r.task.status !== 'done');
        const spanning = open.filter((r) => r.start <= M.today && r.end >= M.today);
        const current = spanning.find((r) => !r.wait) || spanning[0] ||
          open.filter((r) => r.start > M.today).sort((a, b) => a.start - b.start)[0] || open[0];
        nowValue = esc(M.data.phases[current.phase].name);
        nowSub = `Working day ${M.cal.count(M.start, M.today)} of ${total}`;
      }
      const health = behind
        ? `<div class="stat-sub bad">${plural(behind, 'task')} behind schedule</div>`
        : `<div class="stat-sub good">No tasks behind schedule</div>`;

      $('#stats').innerHTML = `
        <div class="stat"><div class="stat-label">Start</div><div class="stat-value">${fmtDay(M.start)}</div>
          <div class="stat-sub">${fmt(M.start, { year: 'numeric' })}</div></div>
        <div class="stat"><div class="stat-label">Target finish</div><div class="stat-value">${fmtDay(M.finish)}</div>
          <div class="stat-sub">${plural(total, 'working day')}, about ${Math.round((M.finish - M.start + 1) / 7)} weeks</div></div>
        <div class="stat"><div class="stat-label">Progress</div><div class="stat-value">${pct}%</div>
          <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
          <div class="stat-sub">${done} of ${plural(real.length, 'task')} done</div></div>
        <div class="stat"><div class="stat-label">Right now</div><div class="stat-value">${nowValue}</div>
          <div class="stat-sub">${nowSub}</div>${health}</div>`;
    }

    function itemHTML(r, opts) {
      const tr = tradeOf(r);
      const st = statusOf(r);
      const isCrit = M.crit.has(r.id);
      const badge = st.key === 'planned' ? (opts && opts.critBadge && isCrit ? '<span class="badge crit">Critical</span>' : '') : `<span class="badge ${st.key}">${st.label}</span>`;
      return `<li><button type="button" class="item${isCrit ? ' is-crit' : ''}" data-id="${esc(r.id)}">
        <span class="datebox"><b>${fmt(r.start, { month: 'short' })}</b><span>${fmt(r.start, { day: 'numeric' })}</span></span>
        <span class="item-main">
          <span class="item-name">${esc(r.task.name)}</span>
          <span class="item-sub"><i class="dot" style="--c:${esc(tr.color)}"></i>${esc(tr.name)} · ${rangeShort(r)} · ${r.milestone ? 'Milestone' : r.task.weeks ? plural(r.task.weeks, 'wk') : plural(r.task.days, 'day')}</span>
        </span>${badge}</button></li>`;
    }

    function renderUpcoming() {
      const horizon = M.today + 14;
      const list = M.items
        .filter((r) => r.task.status !== 'done' && r.end >= M.today && r.start <= horizon)
        .sort((a, b) => a.start - b.start || a.end - b.end);
      $('#upcomingSub').textContent = `${fmtShort(M.today)} – ${fmtShort(horizon)}`;
      $('#upcoming').innerHTML = list.length
        ? list.map((r) => itemHTML(r)).join('')
        : `<li class="empty">Nothing scheduled in the next two weeks.${M.today < M.start ? ` Work begins ${fmtDay(M.start)}.` : ''}</li>`;
    }

    function renderChips() {
      const counts = {};
      M.items.forEach((r) => { counts[r.task.trade] = (counts[r.task.trade] || 0) + 1; });
      const chip = (key, label, color, n) => `<button type="button" class="chip" data-trade="${esc(key)}" aria-pressed="${state.trade === key}">
        ${color ? `<i class="dot" style="--c:${esc(color)}"></i>` : ''}${esc(label)} <span class="n">${n}</span></button>`;
      $('#chips').innerHTML = chip('', 'All trades', null, M.items.length) +
        Object.keys(M.trades).filter((k) => counts[k]).map((k) => chip(k, M.trades[k].name, M.trades[k].color, counts[k])).join('');
      $('#chips').querySelector('[data-trade=""]').setAttribute('aria-pressed', String(!state.trade));
      // On phones the chips scroll sideways, so bring the selected one into view.
      const pressed = $('#chips').querySelector('[aria-pressed="true"]');
      if (pressed) $('#chips').scrollLeft = pressed.offsetLeft - $('#chips').offsetLeft - 16;
    }

    function renderShare() {
      const box = $('#share');
      if (!state.trade) { box.hidden = true; return; }
      box.innerHTML = `<span>Showing <strong>${esc(M.trades[state.trade].name)}</strong> only. Send this link so they see just their dates.</span>
        <button type="button" class="btn" id="copyLink">Copy link</button>
        <button type="button" class="linkbtn" data-trade="">Show all trades</button>`;
      box.hidden = false;
    }

    function renderTimeline(items) {
      const el = $('#timeline');
      if (!items.length) { el.innerHTML = '<p class="empty">No tasks for this trade.</p>'; return; }

      // Keep the same date range for every filter so views line up.
      const first = M.start;
      const last = M.finish;
      const c0 = first - ((weekday(first) + 6) % 7); // Monday on/before
      const c1 = last + ((7 - weekday(last)) % 7);   // Sunday on/after
      const days = c1 - c0 + 1;
      const width = el.clientWidth || 1000;
      const narrow = width < 700;
      const labelW = narrow ? 150 : 340;
      const dayW = Math.max(narrow ? 7 : 9, Math.min(30, Math.floor(((width - labelW - 2) / days) * 2) / 2));
      const W = days * dayW;
      const x = (n) => (n - c0) * dayW;

      let months = '';
      for (let n = c0; n <= c1;) {
        const d = new Date(n * DAY_MS);
        const next = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / DAY_MS;
        const end = Math.min(next, c1 + 1);
        months += `<div class="g-month" style="left:${x(n)}px;width:${(end - n) * dayW}px">${(end - n) * dayW > 60 ? fmt(n, { month: 'long', year: 'numeric' }) : ''}</div>`;
        n = end;
      }
      let weeks = '';
      for (let n = c0; n <= c1; n += 7) {
        weeks += `<div class="g-week" style="left:${x(n)}px;width:${7 * dayW}px">${fmt(n, { day: 'numeric' })}</div>`;
      }

      let hol = '';
      M.cal.off.forEach((n) => {
        if (n >= c0 && n <= c1 && weekday(n) % 6 !== 0) hol += `<div class="g-hol" style="left:${x(n)}px;width:${dayW}px" title="${esc(fmtDay(n))}: no work"></div>`;
      });
      const showToday = M.today >= c0 && M.today <= c1;
      const todayX = x(M.today) + dayW / 2;

      let rows = '';
      let lastPhase = -1;
      for (const r of items) {
        if (r.phase !== lastPhase) {
          rows += `<div class="g-row phase"><div class="g-label" style="width:${labelW}px">${esc(M.data.phases[r.phase].name)}</div><div class="g-track" style="width:${W}px"></div></div>`;
          lastPhase = r.phase;
        }
        const tr = tradeOf(r);
        const st = statusOf(r);
        const isCrit = M.crit.has(r.id);
        const cls = ['g-bar', r.milestone ? 'ms' : '', r.wait ? 'wait' : '', `st-${st.key}`, isCrit ? 'crit' : ''].join(' ');
        const left = x(r.start);
        const w = (r.end - r.start + 1) * dayW;
        const tip = esc(`${r.task.name} · ${rangeLong(r)} · ${st.label}`);
        const bar = r.milestone
          ? `<div class="${cls}" data-id="${esc(r.id)}" title="${tip}" style="--c:${esc(tr.color)};left:${left + dayW / 2 - 6.5}px"></div>`
          : `<div class="${cls}" data-id="${esc(r.id)}" title="${tip}" style="--c:${esc(tr.color)};left:${left}px;width:${w}px"></div>`;
        const markX = r.milestone ? left + dayW / 2 + 10 : left + w + 5;
        const mark = st.key === 'done' ? `<span class="g-mark done" style="left:${markX}px">✓</span>`
          : ['overdue', 'delayed'].includes(st.key) ? `<span class="g-mark bad" style="left:${markX}px">!</span>` : '';
        rows += `<div class="g-row${isCrit ? ' is-crit' : ''}">
          <button type="button" class="g-label" data-id="${esc(r.id)}" style="width:${labelW}px">
            <i class="dot" style="--c:${esc(tr.color)}"></i><span class="g-name">${esc(r.task.name)}</span><span class="g-dates">${rangeShort(r)}</span>
          </button>
          <div class="g-track" style="width:${W}px">${bar}${mark}</div></div>`;
      }

      const gridBg = `background-size:${7 * dayW}px 100%;background-image:linear-gradient(to right, var(--gridline) 1px, transparent 1px),linear-gradient(to right, transparent ${5 * dayW}px, var(--weekend) ${5 * dayW}px)`;
      el.className = `gantt${narrow ? ' narrow' : ''}${state.critical ? ' crit-on' : ''}`;
      el.innerHTML = `<div class="g-inner" style="width:${labelW + W}px">
        <div class="g-head">
          <div class="g-corner" style="width:${labelW}px">Task</div>
          <div class="g-scale" style="width:${W}px">${months}${weeks}${showToday ? `<div class="g-today-pill" style="left:${todayX}px">TODAY</div>` : ''}</div>
        </div>
        <div class="g-body">
          <div class="g-grid" style="left:${labelW}px;width:${W}px;${gridBg}">${hol}${showToday ? `<div class="g-today" style="left:${todayX}px"></div>` : ''}</div>
          ${rows}
        </div></div>`;
    }

    function renderList(items) {
      const el = $('#list');
      el.className = `list${state.critical ? ' crit-on' : ''}`;
      if (!items.length) { el.innerHTML = '<p class="empty">No tasks for this trade.</p>'; return; }
      let html = '';
      M.data.phases.forEach((p, i) => {
        const group = items.filter((r) => r.phase === i);
        if (group.length) html += `<h3>${esc(p.name)}</h3><ul class="items">${group.map((r) => itemHTML(r, { critBadge: state.critical })).join('')}</ul>`;
      });
      el.innerHTML = html;
    }

    function renderSchedule() {
      const items = visibleItems();
      document.querySelectorAll('.segmented button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
      $('#critToggle').checked = state.critical;
      $('#timeline').hidden = state.view !== 'timeline';
      $('#list').hidden = state.view !== 'list';
      if (state.view === 'timeline') renderTimeline(items); else renderList(items);
    }

    function renderTeam() {
      $('#team').innerHTML = Object.keys(M.trades).map((k) => {
        const tr = M.trades[k];
        const mine = M.items.filter((r) => r.task.trade === k);
        if (!mine.length) return '';
        const from = Math.min(...mine.map((r) => r.start));
        const to = Math.max(...mine.map((r) => r.end));
        const next = mine.filter((r) => r.task.status !== 'done' && r.end >= M.today).sort((a, b) => a.start - b.start)[0];
        return `<button type="button" class="member" data-trade="${esc(k)}">
          <div class="member-top"><i class="dot" style="--c:${esc(tr.color)}"></i>${esc(tr.name)}</div>
          ${tr.who ? `<div class="member-who">${esc(tr.who)}</div>` : ''}
          <div class="member-when">${rangeShort({ start: from, end: to })} · ${plural(mine.length, 'task')}</div>
          <div class="member-next">${next ? `Next: ${esc(next.task.name)}, ${fmtShort(next.start)}` : 'All done ✓'}</div>
        </button>`;
      }).join('');
    }

    function renderFooter() {
      const url = M.data.project.editUrl;
      $('#footer').innerHTML = `Dates are estimates and will shift as contractors confirm.${url ? ` · <a href="${esc(url)}">Edit schedule</a>` : ''}`;
    }

    function openDetail(id) {
      const r = M.byId.get(id);
      if (!r) return;
      const tr = tradeOf(r);
      const st = statusOf(r);
      const link = (d) => { const x = M.byId.get(d); return x ? `<button type="button" class="linkbtn" data-goto="${esc(d)}">${esc(x.task.name)}</button>` : ''; };
      const waits = (r.task.after || []).map(link).join('');
      const unblocks = M.succ.get(r.id).map(link).join('');
      $('#detailBody').innerHTML = `
        <div class="d-top">
          <span class="d-trade"><i class="dot" style="--c:${esc(tr.color)}"></i>${esc(tr.name)}</span>
          <button type="button" class="d-close" data-close aria-label="Close">×</button>
        </div>
        <h3 id="dTitle">${esc(r.task.name)}</h3>
        <dl>
          <dt>When</dt><dd>${rangeLong(r)}, ${fmt(r.end, { year: 'numeric' })}</dd>
          <dt>Duration</dt><dd>${durationText(r)}</dd>
          ${tr.who ? `<dt>Who</dt><dd>${esc(tr.who)}</dd>` : ''}
          <dt>Status</dt><dd><span class="badge ${st.key}">${st.label}</span></dd>
          ${waits ? `<dt>Waits on</dt><dd class="d-links">${waits}</dd>` : ''}
          ${unblocks ? `<dt>Unblocks</dt><dd class="d-links">${unblocks}</dd>` : ''}
        </dl>
        ${M.crit.has(r.id) ? '<p class="d-crit">◆ On the critical path: any delay here pushes back the finish date.</p>' : ''}
        ${r.task.notes ? `<p class="d-note">${esc(r.task.notes)}</p>` : ''}
        ${r.conflict ? `<p class="d-warn">⚠ ${esc(r.conflict)}</p>` : ''}`;
      const dlg = $('#detail');
      if (!dlg.open) dlg.showModal();
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1800);
    }

    function syncUrl() {
      const p = new URLSearchParams(location.search);
      if (state.trade) p.set('trade', state.trade); else p.delete('trade');
      const qs = p.toString();
      history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
    }

    function setTrade(key) {
      state.trade = key || null;
      syncUrl();
      renderChips();
      renderShare();
      renderSchedule();
    }

    // ============================================
    // EVENTS
    // ============================================
    function wire() {
      document.addEventListener('click', async (e) => {
        const tradeBtn = e.target.closest('[data-trade]');
        if (tradeBtn) {
          setTrade(tradeBtn.dataset.trade);
          if (tradeBtn.classList.contains('member')) $('#schedule').scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        }
        const go = e.target.closest('[data-goto]');
        if (go) { openDetail(go.dataset.goto); return; }
        if (e.target.closest('[data-close]')) { $('#detail').close(); return; }
        const task = e.target.closest('[data-id]');
        if (task) { openDetail(task.dataset.id); return; }
        if (e.target.closest('#copyLink')) {
          try { await navigator.clipboard.writeText(location.href); toast('Link copied'); }
          catch (err) { window.prompt('Copy this link:', location.href); }
        }
      });
      $('#detail').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
      document.querySelectorAll('.segmented button').forEach((b) => b.addEventListener('click', () => {
        state.view = b.dataset.view;
        renderSchedule();
      }));
      $('#critToggle').addEventListener('change', (e) => { state.critical = e.target.checked; renderSchedule(); });
      let lastW = window.innerWidth;
      let timer;
      window.addEventListener('resize', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (window.innerWidth !== lastW && state.view === 'timeline') { lastW = window.innerWidth; renderSchedule(); }
        }, 120);
      });
    }

    // ============================================
    // START
    // ============================================
    try {
      M = build();
      const t = params.get('trade');
      state.trade = t && M.trades[t] ? t : null;
      state.view = window.innerWidth < 700 ? 'list' : 'timeline';
      $('#app').hidden = false;
      renderHeader();
      renderStats();
      renderUpcoming();
      renderChips();
      renderShare();
      renderSchedule();
      renderTeam();
      renderFooter();
      wire();
    } catch (err) {
      const box = $('#errors');
      box.innerHTML = `<strong>The schedule couldn't be drawn.</strong><br>${esc(err.message)}`;
      box.hidden = false;
      console.error(err);
    }
  })();
  </script>
</body>
</html>
