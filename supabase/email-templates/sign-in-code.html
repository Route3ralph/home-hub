<!-- Paste into Supabase → Authentication → Emails → Templates, in both "Confirm signup" and "Magic Link".
     Subject: Your Home Hub sign-in code
     There is deliberately no sign-in link: email security scanners open links, which would use up the code. -->
<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f1b16;max-width:480px">
  <h2 style="margin:0 0 12px">Your Home Hub sign-in code</h2>
  <p style="font-size:15px;margin:0 0 8px">Type this code on the Home Hub sign-in page:</p>
  <p style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:6px;margin:12px 0 16px">{{ .Token }}</p>
  <p style="font-size:14px;color:#4f483f;margin:0 0 8px">It works once and expires in an hour. If you didn't ask to sign in, you can ignore this email.</p>
  <p style="font-size:14px;margin:0"><a href="{{ .SiteURL }}" style="color:#2f5d50">Open Home Hub</a></p>
</div>
